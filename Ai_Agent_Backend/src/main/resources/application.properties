spring.application.name=Ai_Agent

# Google GenAI Credentials (Loaded from .env or environment)
spring.ai.google.genai.api-key=${API_KEY:}
spring.ai.google.genai.embedding.api-key=${API_KEY:}

# Model Configuration
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3-flash-preview}
spring.ai.google.genai.chat.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:300}

# Server & Security
server.port=${PORT:8080}
server.error.include-message=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# External Services
app.weather.provider-url=${WEATHER_PROVIDER_URL:https://api.open-meteo.com}